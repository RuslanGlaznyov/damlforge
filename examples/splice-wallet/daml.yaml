sdk-version: 3.5.2
name: splice-wallet
source: daml
version: 0.1.25
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
- ../dars/splice-api-token-holding-v1-1.0.0.dar
- ../dars/splice-api-token-metadata-v1-1.0.0.dar
- ../dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
- ../dars/splice-api-token-allocation-instruction-v1-1.0.0.dar
- ../dars/splice-api-token-allocation-v1-1.0.0.dar
- ../dars/splice-api-reward-assignment-v1-1.0.0.dar
- ../dars/splice-api-token-transfer-instruction-v2-1.0.0.dar
- ../dars/splice-api-token-allocation-instruction-v2-1.0.0.dar
- ../dars/splice-api-token-allocation-request-v2-1.0.0.dar
- ../dars/splice-api-token-allocation-v2-1.0.0.dar
- ../dars/splice-token-standard-utils-2.0.0.dar
- ../dars/splice-amulet-0.1.24.dar
- ../dars/splice-util-0.1.8.dar
- ../dars/splice-wallet-payments-0.1.24.dar
build-options:
  - --explicit-serializable=yes
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
  - -Wno-deprecated-exceptions
  - --target=2.1
codegen:
  java:
    package-prefix: org.lfdecentralizedtrust.splice.codegen.java
    decoderClass: org.lfdecentralizedtrust.splice.codegen.java.DecoderSpliceWallet
    output-directory: target/daml-codegen-java
